<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Склад FulHub 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  body { margin:0; font:14px/1.4 system-ui, sans-serif; }
  /* Вход: одна карточка по центру, цвета склада — сталь и сигнальный синий. После входа страница целиком отдаётся 3D-стенду. */
  :root { --bg:#eef0f2; --card:#ffffff; --ink:#1d2330; --muted:#5b6474; --line:#cfd5dc; --acc:#2b6ed9; --err:#b3261e;
          --f-head:'Space Grotesk', system-ui, sans-serif; --f-body:'Inter', system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#171b21; --card:#232931; --ink:#e8ebf0; --muted:#9aa3b2; --line:#39414d; --acc:#6aa1ff; --err:#ff8a80; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#171b21; --card:#232931; --ink:#e8ebf0; --muted:#9aa3b2; --line:#39414d; --acc:#6aa1ff; --err:#ff8a80; color-scheme:dark; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); }
  #lock { min-height:100%; display:grid; place-items:center; padding-block:32px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); font-family:var(--f-body); }
  #lock form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px 24px; display:grid; gap:14px; }
  #lock h1 { margin:0; font:600 22px/1.2 var(--f-head); text-wrap:balance; }
  #lock p { margin:0; color:var(--muted); font-size:14px; line-height:1.45; }
  #lock .meta { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  #lock label { font-size:13px; color:var(--muted); display:grid; gap:6px; }
  #lock input { font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  #lock input:focus-visible, #lock button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  #lock button { font:600 15px var(--f-body); padding:11px 14px; border:0; border-radius:6px; background:var(--acc); color:#fff; cursor:pointer; }
  #lock button[disabled] { opacity:.6; cursor:progress; }
  #msg { min-height:1.3em; font-size:13px; color:var(--err); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap">

</div>
